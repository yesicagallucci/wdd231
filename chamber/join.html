<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form to join the chamber of commerce of Caacupe</title>
    <meta name="description" content="Chamber of Commerce of Caacupe - this is a fictional chamber of commerce, this site was created for educational purposes">
    <meta name="author" content="Yesica Gallucci">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fascinate&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="icon" href="./images/favicon.ico">
    <meta property="og:title" content="Chamber of Commerce of Caacupe - Members"> 
    <meta property="og:description" content="Home page of the Chamber of Commerce of Caacupe - this is a fictional chamber of commerce, this site was created for educational purposes">
    <meta property="og:image" content="https://yesicagallucci.github.io/wdd231/chamber/images/background-%20ccc.jpg">
    <meta property="og:url" content="https://yesicagallucci.github.io/wdd231/chamber/index.html">
    <script src="./scripts/getdates.js" defer></script>
    <script src="./scripts/menu.js" defer></script>
    <script src="./scripts/form.js" defer></script>
    

</head>
<body>
    <header>
        <a href="index.html" aria-label="go to home" ><img src="./images/cccaacupe-logo.svg" alt="logo for the Caacupe chamber of commerce"></a>
        <h1>Caacupe's Chamber of Commerce</h1>
        <a id="menu" href="#"></a>
        <nav class="navigation">
            <ul class="navigation-menu">
                <li><a href="index.html" aria-label="home">Home</a></li>
                <li><a href="directory.html" aria-label="directory">Directory</a></li>
                <li><a href="join.html" class="active" aria-label="join">Join</a></li>
                <li><a href="discover.html" aria-label="discover">Discover</a></li>
            </ul>
        </nav>
        <div id="mode"></div>
        
    </header>

    <main class="join">
        <h2>Join the Chamber</h2>
        <div class="form">
            <form method="get" action="thankyou.html" class="join-form">
                <fieldset class="personal-data">
                    <legend>Applicant's Information</legend>
                    <label>First Name*<input type="text" autocomplete="given-name" name="fname" required title="first name"></label>
                    <label>Last Name* <input type="text" autocomplete="family-name" name="lname" required title="family name"></label>
                    <label>Organizationl Title* <input type="text" name="organization" title="Applicant's organizational title within their organization" autocomplete="organization-title" pattern="[A-Za-z\- ]{7,}" required></label>
                    <label>Email Address*<input type="email" name="email" placeholder="name@server.com" title="Applicant's email address" autocomplete="email" required></label>
                    <label>Mobile Phone Number <input type="tel" name="phone" title="mobile phone number" autocomplete="number" required placeholder="+595 999 123456" pattern="^\+?[0-9\s\-]{7,15}$" ></label>
                </fieldset>
                <fieldset>
                    <legend>Business' Information</legend>
                    <label>Business/Organization's Name <input type="text" name="business" title="business name" autocomplete="organization" required></label>
                    <label>Business/Organization's Description<textarea title="business description" name="orgDescription"></textarea></label>
                </fieldset>
                <fieldset>
                    <legend>Membership Level</legend>
                    <label><input type="radio" name="membership" value="np" required>NP Membership</label>
                    <label><input type="radio" name="membership" value="bronze">Bronze Membership</label>
                    <label><input type="radio" name="membership" value="silver">Silver Membership</label>
                    <label><input type="radio" name="membership" value="gold">Gold Membership</label>
                </fieldset>
                <input type="hidden" id="formTimestamp" name="formTimestamp" value="">
                <input type="submit" value="Became a Member">
            </form>

        </div>
        <div class="membership-cards">
            <div id="membership-cards"></div>
            <dialog id="modal-np"></dialog>
            <dialog id="modal-bronze"></dialog>
            <dialog id="modal-silver"></dialog>
            <dialog id="modal-gold"></dialog>
        </div>
        
    </main>

    <footer>
        <div class="ccc-data">
            <p>Caacupe Chamber of Commerce</p>
            <p>Caacupe, Cordillera, Paraguay</p>
        </div>
        <div class="smedia">
            <a href="https://github.com/yesicagallucci"><img src="images/github.svg" alt="github icon"></a>
            <a href="linkedin.com/in/yesicagallucci/"><img src="images/linkedin.svg" alt="linkedin icon"></a>
            <a href="https://www.behance.net/yesicagallucci"><img src="images/behance.svg" alt="behance icon"></a>
        </div>    
        <div class="footer-content">
            <p>WDD231 Class Project</p>
            <p>Yesica Gallucci</p>
            <p>&copy;<span id="currentyear"></span> Caacupe Chamber of Commerce</p>
            <p id="lastmodified"></p>
        </div>
    </footer>
</body>
</html>

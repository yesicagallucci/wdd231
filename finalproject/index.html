<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 231 Final Project - ReadTwist</title>
    <meta name="description" content="ReadTwist – Your personal hub to track what yo've read, explore new books, and decide your next adventure.">
    <meta name="author" content="Yesica Gallucci">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/medium.css">
    <link rel="stylesheet" href="./styles/large.css">
    <link rel="icon" href="./images/favicon.ico">
    <meta property="og:title" content="ReadTwist website"> 
    <meta property="og:description" content="ReadTwist – Your personal hub to track what you've read, explore new books, and decide your next adventure.">
    <meta property="og:image" content="">
    <meta property="og:url" content="https://yesicagallucci.github.io/wdd231/finalproject/index.html">
    <script src="scripts/getdates.js" defer></script>
    <script type="module" src="scripts/index-main.js"></script>
    <script src="scripts/menu.js" defer></script>
    
</head>
<body>
    <header>
        <a href="index.html" aria-label="go to home"><img src="./images/readtwist-logo-border-smaller.webp" alt="logo of ReadTwist"></a>
        <h1>Track what you read, the next one's a surprise</h1>
        <a id="menu" href="#"></a>
        <nav class="navigation">
            <ul class="navigation-menu">
                <li><a href="index.html" class="active" aria-label="home">Dashboard</a></li>
                <li><a href="./catalog.html" aria-label="catalog">Catalog</a></li>
                <li><a href="./readings.html" aria-label="readings">Readings</a></li>            
            </ul>
        </nav>
        
    </header>
    <main class="dashboard">
        <section class="quick-stats">
            <h2>Stats</h2>
            <p id="statsFuture"></p>
            <p id="statsCompleted"></p>
        </section>

        <section class="twist-invite">
            <h2>Ready for a Twist?</h2>
            <p>Let the app surprise you with your next read! Click below to spin the wheel and discover your next adventure.</p>
            <button><a href="readings.html" class="twist-link">Go to Twist</a></button>
        </section>

        <section class="dashboard-cards">
            <div id="currentCard" class="book-card"></div>
            <div id="twistCard" class="book-card"></div>
        </section>

        <form action="journal-action.html" method="get">
            <label for="journalEntry">Add Journal Entry:</label>
            <textarea id="journalEntry" name="journalEntry" rows="3" placeholder="Write your thoughts..."></textarea>
            <button type="submit">Save Entry</button>
        </form>

    </main>


    <footer>
        <p>&copy;<span id="currentyear"></span> By Yesica Gallucci</p>
        <p id="lastmodified"></p>
        <a href="./siteplan.html" target="_blank">Site plan</a> <a href="./references.html" target="_blank">Reference Page</a>
    </footer>  
</body>
</html>
